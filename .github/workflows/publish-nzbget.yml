name: Publish verified NZBGet image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-nzbget-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the validated image archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download nzbget-2026.10.03.2 --repo "$REPOSITORY" --pattern cleanuparr-nzbget-transport-image.tar.gz
          echo "1a35f17e63ca8f90510067d09ec1861d0faed5fbd8cf54c5a83fada3e2f9c1ec  cleanuparr-nzbget-transport-image.tar.gz" | sha256sum -c -
          gzip -dc cleanuparr-nzbget-transport-image.tar.gz | docker load
      - name: Publish the validated Linux amd64 image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag localhost/cleanuparr-nzbget:2026-10-03.2 ghcr.io/purcilas/cleanuparr-nzbget:2026-10-03.2
          docker push ghcr.io/purcilas/cleanuparr-nzbget:2026-10-03.2
          docker image inspect ghcr.io/purcilas/cleanuparr-nzbget:2026-10-03.2 --format '{{json .RepoDigests}}'
      - name: Clear registry authentication
        if: always()
        run: docker logout ghcr.io
